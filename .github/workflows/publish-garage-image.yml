name: Publish Garage image

on:
  push:
    paths:
      - "images/garage/**"
      - ".github/workflows/publish-garage-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test exposed Garage port
        run: sh images/garage/test-image.sh ghcr.io/${{ github.repository_owner }}/cf-esb-garage:2.3.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: images/garage
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cf-esb-garage:2.3.1
            ghcr.io/${{ github.repository_owner }}/cf-esb-garage:sha-${{ github.sha }}
